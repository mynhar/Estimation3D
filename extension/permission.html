<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caméra · Estimation3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400&display=swap">
  <style>
    /* Copia de los tokens de src/styles/tokens.css: esta página no carga la app. */
    :root {
      --ds-bg: #F5F3EE; --ds-surface: #FBFAF6; --ds-border: #E8E5DC; --ds-ink: #1A1A1A;
      --ds-ink-muted: #615E58; --ds-gold: #D4B96E; --ds-gold-hover: #C2A85C; --ds-gold-active: #B0964A;
      --ds-success-ink: #4C6A40; --ds-danger-ink: #993E3E;
      --ds-font-display: "Fraunces", ui-serif, Georgia, serif;
      --ds-font-body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--ds-bg); color: var(--ds-ink); font: 400 15px/1.6 var(--ds-font-body);
    }
    main {
      width: min(100%, 30rem); padding: 32px; border: 1px solid var(--ds-border); border-radius: 12px;
      background: var(--ds-surface); box-shadow: 0 1px 2px rgba(26, 26, 26, .04), 0 12px 24px rgba(26, 26, 26, .06);
    }
    .ring {
      width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ds-gold);
      box-shadow: inset 0 0 0 6px var(--ds-surface), inset 0 0 0 24px var(--ds-ink);
    }
    h1 {
      margin: 20px 0 8px; font: 400 26px/1.2 var(--ds-font-display); letter-spacing: -0.02em;
    }
    p { margin: 0 0 12px; color: var(--ds-ink-muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    button {
      display: inline-flex; align-items: center; height: 42px; padding: 0 20px; white-space: nowrap;
      border: 1px solid var(--ds-gold); border-radius: 6px; background: var(--ds-gold); color: var(--ds-ink);
      font: 600 15px/1 var(--ds-font-body); cursor: pointer;
      transition: background-color 150ms cubic-bezier(.16, 1, .3, 1), transform 150ms cubic-bezier(.16, 1, .3, 1);
    }
    button:hover { background: var(--ds-gold-hover); border-color: var(--ds-gold-hover); transform: translateY(-1px); }
    button:active { background: var(--ds-gold-active); border-color: var(--ds-gold-active); transform: none; }
    button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(212, 185, 110, .4); }
    button.secondary { background: transparent; border-color: var(--ds-ink); }
    button.secondary:hover { background: var(--ds-ink); color: var(--ds-surface); }
    [hidden] { display: none !important; }
    .status { min-height: 1.6em; margin: 16px 0 0; color: var(--ds-success-ink); font-weight: 500; }
    .status.is-error { color: var(--ds-danger-ink); }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true"></div>
    <h1 data-t="title"></h1>
    <p data-t="body"></p>
    <p data-t="hint"></p>
    <div class="actions">
      <button type="button" id="allow" data-t="allow"></button>
      <button type="button" id="settings" class="secondary" data-t="settings" hidden></button>
    </div>
    <p class="status" id="status" role="status"></p>
  </main>
  <script src="permission.js"></script>
</body>
</html>
