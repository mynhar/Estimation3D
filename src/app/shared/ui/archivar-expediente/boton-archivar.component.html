<button type="button" class="btn-archivar"
        [disabled]="control().archivando() || control().confirmando()"
        [attr.aria-label]="control().textosBoton().btnAria | translate"
        [attr.aria-controls]="control().panelId"
        [attr.aria-expanded]="control().confirmando()"
        (click)="control().iniciar()">
  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect width="20" height="5" x="2" y="3" rx="1"/>
    @if (control().accion() === 'desarchivar') {
      <!-- lucide archive-restore -->
      <path d="M4 8v11a2 2 0 0 0 2 2h2"/>
      <path d="M20 8v11a2 2 0 0 1-2 2h-2"/>
      <path d="m9 15 3-3 3 3"/>
      <path d="M12 12v9"/>
    } @else {
      <!-- lucide archive -->
      <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
      <path d="M10 12h4"/>
    }
  </svg>
  {{ control().textosBoton().btn | translate }}
</button>
