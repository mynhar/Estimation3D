@if (total() > pageSize()) {
  <div class="pagination-bar d-flex align-items-center justify-content-between flex-wrap gap-2">
    <small class="text-muted pagination-info">
      {{ from() }}&ndash;{{ to() }} {{ 'pagination.of' | translate }} {{ total() }}
    </small>
    <nav aria-label="pagination">
      <ul class="pagination pagination-sm mb-0">

        <li class="page-item" [class.disabled]="page() === 1">
          <button class="page-link" (click)="prev()" [attr.aria-label]="'pagination.prev' | translate">
            <i class="bi bi-chevron-left"></i>
          </button>
        </li>

        @for (p of pages(); track $index) {
          @if (p === '...') {
            <li class="page-item disabled"><span class="page-link">…</span></li>
          } @else {
            <li class="page-item" [class.active]="p === page()">
              <button class="page-link" (click)="go(p)">{{ p }}</button>
            </li>
          }
        }

        <li class="page-item" [class.disabled]="page() === totalPages()">
          <button class="page-link" (click)="next()" [attr.aria-label]="'pagination.next' | translate">
            <i class="bi bi-chevron-right"></i>
          </button>
        </li>

      </ul>
    </nav>
  </div>
}
